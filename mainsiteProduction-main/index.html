<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Axono IoT Solutions | Smart Water Metering, Agriculture & Transformer Monitoring</title>
    <meta
      name="description"
      content="Axono delivers end-to-end IoT solutions from sensor to dashboard — residential water metering for buildings & apartments, smart agriculture, and transformer monitoring & control."
    />
    <meta
      name="keywords"
      content="IoT solutions, smart water metering, apartment water meter, residential water metering, smart agriculture IoT, transformer monitoring, transformer control, sensor to dashboard, building automation, AMR, AMI, Axono"
    />
    <meta name="author" content="Axono IoT Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.axonoiot.com/" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axono IoT Solutions" />
    <meta property="og:title" content="Axono IoT Solutions | Smart Water Metering, Agriculture & Transformer Monitoring" />
    <meta
      property="og:description"
      content="End-to-end IoT from sensor to dashboard: residential water metering for buildings & apartments, smart agriculture solutions, and transformer monitoring & control."
    />
    <meta property="og:url" content="https://www.axonoiot.com/" />
    <meta property="og:image" content="https://www.axonoiot.com/axono-logo-hd.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Axono IoT Solutions logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Axono IoT Solutions | Sensor to Dashboard IoT" />
    <meta
      name="twitter:description"
      content="End-to-end IoT: residential water metering, smart agriculture, and transformer monitoring & control — from sensor to dashboard."
    />
    <meta name="twitter:image" content="https://www.axonoiot.com/axono-logo-hd.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Axono IoT Solutions",
      "url": "https://www.axonoiot.com/",
      "logo": "https://www.axonoiot.com/axono-logo-hd.png",
      "description": "End-to-end IoT solutions provider — from sensor to dashboard — specializing in residential water metering for buildings and apartments, smart agriculture, and transformer monitoring and control.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "knowsAbout": [
        "IoT water metering",
        "Smart agriculture",
        "Transformer monitoring and control",
        "Building and apartment water management"
      ]
    }
    </script>

    <!-- Structured Data: Services -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "Service",
          "position": 1,
          "name": "Residential Water Metering",
          "description": "IoT-based water metering solutions for buildings and apartments — automated readings, leak detection, and consumption dashboards.",
          "provider": { "@type": "Organization", "name": "Axono IoT Solutions" }
        },
        {
          "@type": "Service",
          "position": 2,
          "name": "Smart Agriculture Solutions",
          "description": "Sensor-to-dashboard IoT for agriculture — soil, irrigation, and environmental monitoring with actionable insights.",
          "provider": { "@type": "Organization", "name": "Axono IoT Solutions" }
        },
        {
          "@type": "Service",
          "position": 3,
          "name": "Transformer Monitoring & Control",
          "description": "Real-time IoT monitoring and remote control of transformers for reliability, safety, and predictive maintenance.",
          "provider": { "@type": "Organization", "name": "Axono IoT Solutions" }
        },
        {
          "@type": "Service",
          "position": 4,
          "name": "GameTape — Automated Sports Match Recording",
          "description": "Automated match recording for sports venues — badminton, turf cricket, turf football, pickleball and padel. Players scan a QR code at the court to watch and download their game.",
          "provider": { "@type": "Organization", "name": "Axono IoT Solutions" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
